<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/static/css/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Announcement | DLSL Club Finder</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 16px; }
    a { color: #1a5fb4; }
    .small { color: #666; font-size: 14px; }
    .tag { display: inline-block; border: 1px solid #1a5fb4; color: #1a5fb4; border-radius: 12px; padding: 2px 10px; font-size: 13px; margin-right: 6px; }
    
    #body { white-space: pre-wrap; line-height: 1.5; margin-top: 20px; font-size: 17px; }
  </style>
</head>
<body>
  <p id="back"><a href="/">&larr; Back to all clubs</a></p>
  <div id="content">Loading...</div>

  <script>
    const id = new URLSearchParams(location.search).get("id");
    const content = document.getElementById("content");

    function el(tag, text, cls) {
      const e = document.createElement(tag);
      if (text !== undefined) e.textContent = text;
      if (cls) e.className = cls;
      return e;
    }

    fetch("/api/announcements/" + encodeURIComponent(id))
      .then(r => {
        if (r.status === 401) { location.href = "/static/login.html"; return Promise.reject(); }
        return r.ok ? r.json() : Promise.reject();
      })
      .then(a => {
        // The back link goes to the club that posted it
        if (a.club_id) {
          const back = document.getElementById("back");
          back.innerHTML = "";
          const link = el("a", "\u2190 Back to " + a.club);
          link.href = "/static/club.html?id=" + a.club_id;
          back.appendChild(link);
        }
        content.innerHTML = "";
        content.appendChild(el("h1", a.title));
        const meta = el("p", "", "small");
        meta.appendChild(el("span", a.category, "tag"));
        if (a.pinned) meta.appendChild(el("span", "Pinned", "tag"));
        meta.append("Posted by " + a.author + " on " + a.date + (a.club ? " in " + a.club : ""));
        content.appendChild(meta);
        const body = el("div", a.body);
        body.id = "body";
        content.appendChild(body);
      })
      .catch(() => { content.textContent = "Could not load this announcement."; });
  </script>
</body>
</html>

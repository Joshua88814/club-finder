<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/static/css/style.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auth Wireframe</title>
  <style>
    :root {
      --border-color: #333;
      --input-radius: 4px;
      --bg-btn: #efefef;
      --link-color: #0000ee;
      --font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif, system-ui;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('yo.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      min-height: 100vh;
    }

    .form-container {
      background: #fff;
      width: 100%;
      max-width: 420px;
      padding: 30px 25px;
      border: 1px solid #ccc;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.15);
    }

    .hidden {
      display: none;
    }

    .back-link {
      color: var(--link-color);
      text-decoration: underline;
      font-size: 1rem;
      display: inline-block;
      margin-bottom: 25px;
      cursor: pointer;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: normal;
      margin-bottom: 25px;
      color: #000;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 1rem;
      margin-bottom: 8px;
      color: #000;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    select {
      width: 100%;
      height: 48px;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--input-radius);
      font-size: 1rem;
      background-color: #fff;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper::after {
      content: '∨';
      font-size: 0.9rem;
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #333;
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background-color: var(--bg-btn);
      border: 1px solid var(--border-color);
      border-radius: var(--input-radius);
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #e2e2e2;
    }

    .footer-text {
      margin-top: 25px;
      font-size: 1rem;
    }

    .footer-text span {
      color: var(--link-color);
      text-decoration: underline;
      cursor: pointer;
    }

    .msg {
      min-height: 1.2em;
      margin-bottom: 8px;
      color: #b00020;
    }

    .msg.ok {
      color: #1b7a1b;
    }
  </style>
</head>
<body>

  <!-- SIGN UP FORM (hidden until the person clicks Sign up) -->
  <div id="signup-card" class="form-container hidden">
    

    <h1>Sign up</h1>

    <form id="signup-form">
      <div class="form-group">
        <label for="fname">First name</label>
        <input type="text" id="fname" required />
      </div>

      <div class="form-group">
        <label for="lname">Last name</label>
        <input type="text" id="lname" required />
      </div>

      <div class="form-group">
        <label for="signup-email">DLSL email</label>
        <input type="email" id="signup-email" required />
      </div>

      <div class="form-group">
        <label for="signup-password">Password (at least 8 characters)</label>
        <input type="password" id="signup-password" minlength="8" pattern="\S{8,}" title="At least 8 characters, and no spaces" required />
      </div>

      <div class="form-group">
        <label for="role">I am a</label>
        <div class="select-wrapper">
          <select id="role">
            <option value="student">Student</option>
            <option value="teacher">Faculty</option>
            <option value="alumni">Alumni</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="year-level">Grade / year level (optional)</label>
        <input type="text" id="year-level" />
      </div>

      <p id="signup-msg" class="msg"></p>
      <button type="submit" class="btn-submit">Create account</button>
    </form>

    <div class="footer-text">
      Already have an account? <span onclick="showLogin()">Log in</span>
    </div>
  </div>

  <!-- LOGIN FORM (shown first) -->
  <div id="login-card" class="form-container">
    
    
    <h1>Login</h1>

    <form id="login-form">
      <div class="form-group">
        <label for="login-email">DLSL email</label>
        <input type="email" id="login-email" required />
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required />
      </div>

      <p id="login-msg" class="msg"></p>
      <button type="submit" class="btn-submit">Login</button>
    </form>

    <div class="footer-text">
      No account yet? <span onclick="showSignUp()">Sign up</span>
    </div>
  </div>

  <!-- JAVASCRIPT FOR TOGGLING -->
  <script>
    const signupCard = document.getElementById('signup-card');
    const loginCard = document.getElementById('login-card');

    function showLogin() {
      signupCard.classList.add('hidden');
      loginCard.classList.remove('hidden');
    }

    function showSignUp() {
      loginCard.classList.add('hidden');
      signupCard.classList.remove('hidden');
    }

    // Open the sign up card when the address ends with #signup
    if (location.hash === '#signup') showSignUp();

    function val(id) { return document.getElementById(id).value.trim(); }

    async function send(url, data) {
      const res = await fetch(url, { method: 'POST', body: JSON.stringify(data) });
      let body = {};
      try { body = await res.json(); } catch (e) {}
      return { ok: res.ok, body: body };
    }

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('signup-msg');
      msg.className = 'msg';
      msg.textContent = '';
      // Spaces do not count as characters: stop blank names and passwords with spaces before sending
      if (!val('fname') || !val('lname')) { msg.textContent = 'Please enter your first and last name'; return; }
      if (/\s/.test(document.getElementById('signup-password').value)) { msg.textContent = 'Password cannot contain spaces'; return; }
      try {
        const r = await send('/api/signup', {
          first_name: val('fname'),
          last_name: val('lname'),
          email: val('signup-email'),
          password: document.getElementById('signup-password').value,
          user_type: document.getElementById('role').value,
          grade_level: val('year-level')
        });
        if (r.ok) {
          document.getElementById('login-email').value = val('signup-email');
          showLogin();
          const lm = document.getElementById('login-msg');
          lm.className = 'msg ok';
          lm.textContent = 'Account created. Please log in.';
        } else {
          msg.textContent = r.body.error || 'Sign up failed';
        }
      } catch (err) {
        msg.textContent = 'Could not reach the server';
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('login-msg');
      msg.className = 'msg';
      msg.textContent = '';
      try {
        const r = await send('/api/login', {
          email: val('login-email'),
          password: document.getElementById('login-password').value
        });
        if (r.ok) location.href = '/';
        else msg.textContent = r.body.error || 'Login failed';
      } catch (err) {
        msg.textContent = 'Could not reach the server';
      }
    });
  </script>

</body>
</html>

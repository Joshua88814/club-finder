<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="/static/css/style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Club Details | DLSL Club Finder</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 16px; }
    a { color: #1a5fb4; }
    h2 { border-bottom: 1px solid #ddd; padding-bottom: 4px; margin-top: 28px; }
    .box { border: 1px solid #ccc; border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; }
    .small { color: #666; font-size: 14px; }
    .open { color: green; font-weight: bold; }
    .answer { margin: 6px 0 0 18px; padding-left: 10px; border-left: 3px solid #1a5fb4; }
    .pinned { font-weight: bold; }
    .box input, .box textarea, .box select { width: 100%; padding: 8px; margin: 4px 0; box-sizing: border-box; font-family: inherit; }
    .box label input { width: auto; }
    .err { color: #a00; min-height: 1.2em; }
    .ok { color: green; }

    /*  Manage box */
    .manage { margin: 24px 0; padding: 28px 24px; border: 1px solid #ccc; border-radius: 12px; color: #000; }
    .manage h1 { font-size: 26px; font-weight: bold; margin: 0 0 5px; letter-spacing: -0.5px; text-transform: uppercase; }
    .manage h2 { font-size: 18px; font-weight: bold; margin: 0 0 28px; padding: 0; border: 0; text-transform: uppercase; }
    .manage .section-divider { margin: 45px 0 35px; border: 0; border-top: 2px dashed #ccc; }
    .manage .form-group { margin-bottom: 24px; }
    .manage label { display: block; font-size: 14px; font-weight: bold; margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
    .manage input[type="text"], .manage input[type="date"], .manage input[type="datetime-local"], .manage textarea, .manage select {
      width: 100%; padding: 12px 16px; border: 2px solid #2C3E50; border-radius: 25px;
      font-size: 16px; font-family: inherit; outline: none; box-sizing: border-box; background-color: #fff; color: #000; margin: 0;
    }
    .manage input[type="date"], .manage input[type="datetime-local"] { text-align: center; font-weight: bold; cursor: pointer; }
    .manage textarea { border-radius: 12px; height: 140px; resize: vertical; }
    .manage select {
      appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%232C3E50%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C/svg%3E");
      background-repeat: no-repeat; background-position: right 16px center; background-size: 12px;
      cursor: pointer; font-weight: bold; text-align-last: center;
    }
    .manage .checkbox-group { display: flex; align-items: center; margin-bottom: 30px; }
    .manage .checkbox-group input[type="checkbox"] { width: 20px; height: 20px; margin: 0 12px 0 0; cursor: pointer; }
    .manage .checkbox-group label { margin-bottom: 0; cursor: pointer; }
    .manage .submit-btn-container { text-align: center; }
    .manage button[type="submit"] {
      background-color: transparent; border: 2px solid #2C3E50; color: #2C3E50; padding: 12px 40px;
      font-size: 15px; font-weight: bold; border-radius: 25px; cursor: pointer;
      transition: all 0.2s ease-in-out; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .manage button[type="submit"]:hover { background-color: #2C3E50; color: #ffffff; }
    .manage .err { text-align: center; margin: 0 0 12px; }
    .manage-toggle {
      background: transparent; border: 2px solid #2C3E50; color: #2C3E50; padding: 12px 40px;
      font-size: 15px; font-weight: bold; border-radius: 25px; cursor: pointer; margin: 16px 0 8px;
      letter-spacing: 0.5px; text-transform: uppercase; font-family: inherit; transition: all 0.2s ease-in-out;
    }
    .manage-toggle:hover { background: #2C3E50; color: #fff; }
    .del-btn { margin-top: 8px; padding: 4px 12px; border: 1px solid #a00; color: #a00; background: transparent;
               border-radius: 12px; cursor: pointer; font-family: inherit; }
    .del-btn:hover { background: #a00; color: #fff; }
    .qa-row { display: flex; gap: 8px; margin-top: 10px; }
    .qa-row input { flex: 1; }
    .grow { flex: 1; }
    .qa-row select { width: auto; }
    .qa-row .del-btn { margin-top: 0; }
    .att-btn { margin: 8px 0 0 8px; padding: 4px 12px; border: 1px solid #1a5fb4; color: #1a5fb4; background: transparent;
               border-radius: 12px; cursor: pointer; font-family: inherit; }
    .att-btn:hover { background: #1a5fb4; color: #fff; }
    .att-panel { margin-top: 10px; padding-top: 6px; border-top: 1px dashed #ccc; }
  </style>
</head>
<body>
  <p><a href="/">&larr; Back to all clubs</a></p>
  <div id="content">Loading...</div>

  <script>
    const id = new URLSearchParams(location.search).get("id");
    const root = document.getElementById("content");

    // Small helpers so all text is inserted safely
    function el(tag, text, cls) {
      const e = document.createElement(tag);
      if (text !== undefined) e.textContent = text;
      if (cls) e.className = cls;
      return e;
    }
    function delBtn(url, label) {
      const b = el("button", label || "Delete", "del-btn");
      b.onclick = async () => {
        if (!confirm("Delete this? This cannot be undone.")) return;
        const r = await fetch(url, {method: "DELETE"});
        if (r.ok) location.reload(); else alert("Could not delete");
      };
      return b;
    }
    // Shows the attendance sheet for one event (only used by people who manage the club)
    async function loadAttendance(eventId, panel) {
      panel.textContent = "Loading...";
      const r = await fetch("/api/clubs/" + id + "/events/" + eventId + "/attendance");
      const d = await r.json().catch(() => ({}));
      panel.innerHTML = "";
      if (!r.ok) { panel.textContent = d.error || "Could not load attendance"; return; }
      if (d.members.length === 0) { panel.textContent = "No members yet. Add members in Manage this club."; return; }
      const picks = [];
      d.members.forEach(m => {
        const row = el("div", "", "qa-row");
        row.appendChild(el("span", m.name, "grow"));
        const sel = el("select");
        [["", "Not marked"], ["present", "Present"], ["late", "Late"], ["absent", "Absent"], ["excused", "Excused"]].forEach(o => {
          const op = el("option", o[1]); op.value = o[0]; sel.appendChild(op);
        });
        sel.value = m.status;
        row.appendChild(sel);
        panel.appendChild(row);
        picks.push({user_id: m.user_id, sel: sel});
      });
      const msg = el("p", "", "err");
      const save = el("button", "Save attendance");
      save.onclick = async () => {
        const records = picks.filter(x => x.sel.value).map(x => ({user_id: Number(x.user_id), status: x.sel.value}));
        const res = await fetch("/api/clubs/" + id + "/events/" + eventId + "/attendance", {method: "POST", body: JSON.stringify({records: records})});
        const data = await res.json().catch(() => ({}));
        msg.className = res.ok ? "ok" : "err";
        msg.textContent = res.ok ? "Attendance saved." : (data.error || "Could not save");
      };
      panel.append(save, msg);
    }

    function section(title, items, build, emptyMsg) {
      root.appendChild(el("h2", title));
      if (!items || items.length === 0) { root.appendChild(el("p", emptyMsg, "small")); return; }
      items.forEach(i => root.appendChild(build(i)));
    }
    
    fetch("/api/clubs/" + encodeURIComponent(id))
      .then(r => {
        if (r.status === 401) { location.href = "/static/login.html"; return Promise.reject(); }
        return r.ok ? r.json() : Promise.reject();
      })
      .then(c => {
        root.innerHTML = "";
        root.appendChild(el("h1", c.name));

        let following = c.following;
        const followBtn = el("button", following ? "Following" : "Follow this club", "manage-toggle");
        followBtn.onclick = async () => {
          const r = await fetch("/api/clubs/" + id + "/follow", {method: following ? "DELETE" : "POST"});
          if (r.ok) {
            following = !following;
            followBtn.textContent = following ? "Following" : "Follow this club";
          }
        };
        root.appendChild(followBtn);
        root.appendChild(el("p", (c.category || "No category") + " | " + c.status, "small"));
        root.appendChild(el("p", c.description));
        if (c.schedule) root.appendChild(el("p", "Meetings: " + c.schedule + (c.place ? " at " + c.place : "")));
        if (c.email) root.appendChild(el("p", "Contact: " + c.email));

        if (c.can_manage) {
          const box = el("div", "", "manage");
          box.innerHTML = `
            <h1>Manage this club</h1>
            <h2>Post an announcement</h2>
            <form id="announcement-form">
              <div class="form-group">
                <label for="announcement-title">Title</label>
                <input type="text" id="announcement-title" required>
              </div>
              <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" required></textarea>
              </div>
              <div class="form-group">
                <label for="category">Category</label>
                <select id="category">
                  <option value="general">General</option>
                  <option value="recruitment">Recruitment</option>
                  <option value="event">Event</option>
                </select>
              </div>
              <div class="checkbox-group">
                <input type="checkbox" id="pin">
                <label for="pin">Pin to the top</label>
              </div>
              <p id="a-msg" class="err"></p>
              <div class="submit-btn-container"><button type="submit">Post an announcement</button></div>
            </form>

            <hr class="section-divider">

            <h1>Create an event</h1>
            <form id="event-form">
              <div class="form-group">
                <label for="event-title">Event title</label>
                <input type="text" id="event-title" required>
              </div>
              <div class="form-group">
                <label for="venue">Venue</label>
                <input type="text" id="venue" required>
              </div>
              <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" required></textarea>
              </div>
              <div class="form-group">
                <label for="starts">Starts</label>
                <input type="datetime-local" id="starts" required>
              </div>
              <div class="form-group">
                <label for="ends">Ends</label>
                <input type="datetime-local" id="ends" required>
              </div>
              <p id="e-msg" class="err"></p>
              <div class="submit-btn-container"><button type="submit">Create event</button></div>
            </form>

            <hr class="section-divider">

            <h1>Add a requirement</h1>
            <form id="req-form">
              <div class="form-group">
                <label for="req-text">Requirement</label>
                <input type="text" id="req-text" required>
              </div>
              <div class="checkbox-group">
                <input type="checkbox" id="req-mand" checked>
                <label for="req-mand">Required</label>
              </div>
              <p id="r-msg" class="err"></p>
              <div class="submit-btn-container"><button type="submit">Add requirement</button></div>
            </form>

            <hr class="section-divider">

            <h1>Set recruitment dates</h1>
            <form id="rec-form">
              <div class="form-group">
                <label for="rec-year">School year</label>
                <input type="text" id="rec-year" placeholder="2026-2027" required>
              </div>
              <div class="form-group">
                <label for="rec-start">Starts</label>
                <input type="date" id="rec-start" required>
              </div>
              <div class="form-group">
                <label for="rec-end">Ends</label>
                <input type="date" id="rec-end" required>
              </div>
              <div class="form-group">
                <label for="rec-notes">Notes (optional)</label>
                <input type="text" id="rec-notes" placeholder="Auditions on Oct 10, Room 204">
              </div>
              <p id="c-msg" class="err"></p>
              <div class="submit-btn-container"><button type="submit">Save recruitment dates</button></div>
            </form>

            <hr class="section-divider">

            <h1>Edit club info</h1>
            <form id="info-form">
              <div class="form-group">
                <label for="info-desc">Description</label>
                <textarea id="info-desc" required></textarea>
              </div>
              <div class="form-group">
                <label for="info-sched">Meeting schedule</label>
                <input type="text" id="info-sched">
              </div>
              <div class="form-group">
                <label for="info-place">Meeting place</label>
                <input type="text" id="info-place">
              </div>
              <div class="form-group">
                <label for="info-email">Contact email</label>
                <input type="text" id="info-email">
              </div>
              <p id="i-msg" class="err"></p>
              <div class="submit-btn-container"><button type="submit">Save club info</button></div>
            </form>

            <hr class="section-divider">

            <h1>Members</h1>
            <form id="mem-form">
              <div class="form-group">
                <label for="mem-email">Add a member (DLSL email)</label>
                <input type="text" id="mem-email" required>
              </div>
              <p id="m-msg" class="err"></p>
              <div class="submit-btn-container"><button type="submit">Add member</button></div>
            </form>
            <div id="mem-list"></div>`;
          box.style.display = "none";
          const toggle = el("button", "Manage this club", "manage-toggle");
          toggle.onclick = () => {
            const opening = box.style.display === "none";
            box.style.display = opening ? "block" : "none";
            toggle.textContent = opening ? "Close" : "Manage this club";
          };
          root.appendChild(toggle);
          root.appendChild(box);

          async function save(url, data, msgEl) {
            msgEl.textContent = "";
            try {
              const r = await fetch(url, {method: "POST", body: JSON.stringify(data)});
              const d = await r.json().catch(() => ({}));
              if (r.ok) location.reload(); else msgEl.textContent = d.error || "Could not save";
            } catch (e) { msgEl.textContent = "Could not reach the server"; }
          }
          document.getElementById("announcement-form").addEventListener("submit", e => {
            e.preventDefault();
            save("/api/clubs/" + id + "/announcements", {
              title: document.getElementById("announcement-title").value.trim(),
              body: document.getElementById("message").value.trim(),
              category: document.getElementById("category").value,
              is_pinned: document.getElementById("pin").checked
            }, document.getElementById("a-msg"));
          });
          document.getElementById("event-form").addEventListener("submit", e => {
            e.preventDefault();
            save("/api/clubs/" + id + "/events", {
              title: document.getElementById("event-title").value.trim(),
              venue: document.getElementById("venue").value.trim(),
              description: document.getElementById("description").value.trim(),
              start: document.getElementById("starts").value,
              end: document.getElementById("ends").value
            }, document.getElementById("e-msg"));
          });
          document.getElementById("req-form").addEventListener("submit", e => {
            e.preventDefault();
            save("/api/clubs/" + id + "/requirements", {
              description: document.getElementById("req-text").value.trim(),
              mandatory: document.getElementById("req-mand").checked
            }, document.getElementById("r-msg"));
          });
          document.getElementById("rec-form").addEventListener("submit", e => {
            e.preventDefault();
            save("/api/clubs/" + id + "/recruitment", {
              school_year: document.getElementById("rec-year").value.trim(),
              start: document.getElementById("rec-start").value,
              end: document.getElementById("rec-end").value,
              notes: document.getElementById("rec-notes").value.trim()
            }, document.getElementById("c-msg"));
          });

          // Edit club info 
          document.getElementById("info-desc").value = c.description || "";
          document.getElementById("info-sched").value = c.schedule || "";
          document.getElementById("info-place").value = c.place || "";
          document.getElementById("info-email").value = c.email || "";
          document.getElementById("info-form").addEventListener("submit", e => {
            e.preventDefault();
            save("/api/clubs/" + id + "/info", {
              description: document.getElementById("info-desc").value.trim(),
              schedule: document.getElementById("info-sched").value.trim(),
              place: document.getElementById("info-place").value.trim(),
              email: document.getElementById("info-email").value.trim()
            }, document.getElementById("i-msg"));
          });

          // Members list (used for attendance)
          async function loadMembers() {
            const list = document.getElementById("mem-list");
            const r = await fetch("/api/clubs/" + id + "/members");
            const d = await r.json().catch(() => ({}));
            list.innerHTML = "";
            if (!r.ok) { list.textContent = d.error || "Could not load members"; return; }
            list.appendChild(el("p", d.members.length + " member(s)", "small"));
            d.members.forEach(m => {
              const row = el("div", "", "qa-row");
              row.appendChild(el("span", m.name + " (" + m.email + ")", "grow"));
              row.appendChild(delBtn("/api/clubs/" + id + "/members/" + m.user_id, "Remove"));
              list.appendChild(row);
            });
          }
          document.getElementById("mem-form").addEventListener("submit", async e => {
            e.preventDefault();
            const msg = document.getElementById("m-msg");
            const inp = document.getElementById("mem-email");
            msg.className = "err";
            msg.textContent = "";
            const r = await fetch("/api/clubs/" + id + "/members", {method: "POST", body: JSON.stringify({email: inp.value.trim()})});
            const d = await r.json().catch(() => ({}));
            if (r.ok) { inp.value = ""; msg.className = "ok"; msg.textContent = "Member added."; loadMembers(); }
            else msg.textContent = d.error || "Could not add the member";
          });
          loadMembers();
        }

        section("Requirements", c.requirements, r => {
          const d = el("div", (r.mandatory ? "Required: " : "Optional: ") + r.description, "box");
          if (c.can_manage) d.appendChild(delBtn("/api/clubs/" + id + "/requirements/" + r.id));
          return d;
        }, "No requirements posted yet.");

        section("Recruitment schedule", c.recruitment, r => {
          const d = el("div", "", "box");
          d.appendChild(el("div", r.school_year + ": " + r.start + " to " + r.end));
          if (r.open) d.appendChild(el("div", "Recruitment is open now", "open"));
          if (r.notes) d.appendChild(el("div", r.notes, "small"));
          if (c.can_manage) d.appendChild(delBtn("/api/clubs/" + id + "/recruitment/" + r.id));
          return d;
        }, "No recruitment schedule posted yet.");

        section("Announcements", c.announcements, a => {
          const d = el("div", "", "box");
          const page = "/static/announcement.html?id=" + a.id;
          const titleLink = el("a", (a.pinned ? "[Pinned] " : "") + a.title, a.pinned ? "pinned" : "");
          titleLink.href = page;
          const titleRow = el("div");
          titleRow.appendChild(titleLink);
          d.appendChild(titleRow);
          // Long announcements show only the start here; the full text is on its own page
          const isLong = a.body.length > 150;
          d.appendChild(el("div", isLong ? a.body.slice(0, 150) + "..." : a.body));
          if (isLong) {
            const more = el("a", "Read more");
            more.href = page;
            const moreRow = el("div");
            moreRow.appendChild(more);
            d.appendChild(moreRow);
          }
          d.appendChild(el("div", a.date, "small"));
          if (c.can_manage) d.appendChild(delBtn("/api/clubs/" + id + "/announcements/" + a.id));
          return d;
        }, "No announcements yet.");

        section("Events", c.events, e => {
          const d = el("div", "", "box");
          d.appendChild(el("div", e.title, "pinned"));
          d.appendChild(el("div", e.start + " to " + e.end + (e.venue ? " | " + e.venue : ""), "small"));
          if (e.description) d.appendChild(el("div", e.description));
          if (c.can_manage) {
            d.appendChild(delBtn("/api/clubs/" + id + "/events/" + e.id));
            const ab = el("button", "Attendance", "att-btn");
            const panel = el("div", "", "att-panel");
            panel.style.display = "none";
            ab.onclick = () => {
              const opening = panel.style.display === "none";
              panel.style.display = opening ? "block" : "none";
              if (opening) loadAttendance(e.id, panel);
            };
            d.append(ab, panel);
          }
          return d;
        }, "No events yet.");

        section("Questions and answers", c.questions, q => {
          const d = el("div", "", "box");
          d.appendChild(el("div", q.question, "pinned"));
          d.appendChild(el("div", "Asked by " + q.asker + " on " + q.date, "small"));
          if (q.answers.length === 0) d.appendChild(el("div", "Not answered yet.", "small"));
          q.answers.forEach(a => {
            const ad = el("div", "", "answer");
            ad.appendChild(el("div", a.answer));
            ad.appendChild(el("div", "Answered by " + a.answerer + " on " + a.date, "small"));
            d.appendChild(ad);
          });
          if (c.can_manage) {
            const row = el("div", "", "qa-row");
            const inp = document.createElement("input");
            inp.placeholder = "Write an answer...";
            const btn = el("button", "Answer");
            btn.onclick = async () => {
              const text = inp.value.trim();
              if (!text) return;
              const r = await fetch("/api/questions/" + q.id + "/answers", {method: "POST", body: JSON.stringify({answer: text})});
              if (r.ok) location.reload();
              else { const d2 = await r.json().catch(() => ({})); alert(d2.error || "Could not save"); }
            };
            row.append(inp, btn);
            d.appendChild(row);
          }
          return d;
        }, "No questions yet.");

        const ask = el("div", "", "box");
        ask.appendChild(el("b", "Ask a question about this club"));
        const qi = document.createElement("textarea");
        qi.rows = 2;
        qi.placeholder = "Type your question...";
        const qb = el("button", "Send question");
        const qm = el("p", "", "err");
        qb.onclick = async () => {
          qm.textContent = "";
          const text = qi.value.trim();
          if (!text) { qm.textContent = "Please type your question"; return; }
          const r = await fetch("/api/clubs/" + id + "/questions", {method: "POST", body: JSON.stringify({question: text})});
          if (r.ok) location.reload();
          else { const d2 = await r.json().catch(() => ({})); qm.textContent = d2.error || "Could not send"; }
        };
        ask.append(qi, qb, qm);
        root.appendChild(ask);
      })
      .catch(() => { root.textContent = "Could not load this club."; });
  </script>
</body>
</html>
